name: Publish posts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: ruby test/publish_test.rb
      - run: ruby scripts/publish.rb
      - name: Save published posts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          published=false
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "$(TZ=Asia/Seoul date +'%y.%m.%d'). feat: 초안 게시글 자동 발행" -m "이 변경은 GitHub Actions가 수행했다."
            git push origin HEAD:main
            published=true
          fi
          if [ "$published" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
